<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Neon Dodge</title>
<style>
  :root{ --bg:#070b16; --fg:#e8f0ff; --accent:#22d3ee; --accent2:#f472b6; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--fg);
    font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif; overflow:hidden; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; background:radial-gradient(1200px 800px at 50% -10%, #11203f 0%, #070b16 60%);
    touch-action:none; max-width:100vw; max-height:100vh; }
  .hud{ position:fixed; top:14px; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 18px; font-variant-numeric:tabular-nums; pointer-events:none; }
  .hud b{ font-size:22px; } .hud span{ opacity:.7; font-size:13px; letter-spacing:1px; }
  .overlay{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; background:rgba(7,11,22,.72);
    backdrop-filter:blur(3px); }
  .overlay.hide{ display:none; }
  h1{ font-size:min(13vw,86px); font-weight:800; letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text;
    background-clip:text; color:transparent; filter:drop-shadow(0 0 22px rgba(34,211,238,.35)); }
  p{ opacity:.8; max-width:520px; line-height:1.5; font-size:16px; padding:0 20px; }
  .btn{ pointer-events:auto; margin-top:8px; padding:14px 34px; border:0; border-radius:999px;
    font-size:18px; font-weight:700; color:#05121f; cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 8px 30px rgba(34,211,238,.35); }
  .btn:active{ transform:translateY(1px); }
  .mute{ position:fixed; top:12px; right:14px; pointer-events:auto; background:transparent; border:0;
    color:var(--fg); font-size:22px; opacity:.75; cursor:pointer; }
  .tag{ font-size:12px; letter-spacing:3px; opacity:.6; text-transform:uppercase; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="820"></canvas></div>

<div class="hud">
  <div><span>SCORE</span><br><b id="score">0</b></div>
  <div style="text-align:right"><span>BEST</span><br><b id="best">0</b></div>
</div>
<button class="mute" id="mute" title="Mute (M)">🔊</button>

<div class="overlay" id="startScreen">
  <div class="tag">Neon Dodge</div>
  <h1>NEON&nbsp;DODGE</h1>
  <p>Fly the ship. Dodge the falling neon. It only gets faster. Move with the <b>mouse / touch</b> or <b>arrow keys</b>. <b>P</b> pauses, <b>M</b> mutes.</p>
  <button class="btn" id="startBtn">Play</button>
</div>

<div class="overlay hide" id="overScreen">
  <div class="tag">Game Over</div>
  <h1 style="font-size:min(10vw,64px)">WIPED OUT</h1>
  <p>You survived <b id="finalScore">0</b> seconds. <span id="newBest" style="color:var(--accent)"></span></p>
  <button class="btn" id="againBtn">Again</button>
</div>

<div class="overlay hide" id="pauseScreen">
  <div class="tag">Paused</div>
  <h1 style="font-size:min(10vw,64px)">PAUSED</h1>
  <button class="btn" id="resumeBtn">Resume</button>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const el = id => document.getElementById(id);
  const scoreEl=el('score'), bestEl=el('best');

  let best = 0;
  try { best = parseInt(localStorage.getItem('neonDodgeBest')||'0',10)||0; } catch(e){}
  bestEl.textContent = best;

  // ---- audio (all synthesised, no files) ----
  let muted=false, actx=null;
  try { muted = localStorage.getItem('neonDodgeMuted')==='1'; } catch(e){}
  el('mute').textContent = muted ? '🔇' : '🔊';
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq, dur, type='sine', vol=0.2){
    if(muted) return; const a=AC(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t); o.stop(t+dur);
  }
  const sfxPoint=()=>beep(660,0.08,'square',0.08);
  const sfxHit  =()=>{ beep(130,0.5,'sawtooth',0.3); setTimeout(()=>beep(90,0.5,'sawtooth',0.25),60); };
  const sfxStart=()=>{ beep(440,0.1,'square',0.12); setTimeout(()=>beep(660,0.12,'square',0.12),100); };

  // ---- state ----
  let state='start'; // start | play | over | pause
  const ship={ x:W/2, y:H-110, r:16, tx:W/2 };
  let obstacles=[], stars=[], t=0, score=0, spawnT=0, speed=2.4, raf=null;

  function reset(){
    obstacles=[]; t=0; score=0; spawnT=0; speed=2.4; ship.x=ship.tx=W/2; ship.y=H-110;
    stars = Array.from({length:60},()=>({x:Math.random()*W, y:Math.random()*H, z:Math.random()*2+0.4}));
    scoreEl.textContent='0';
  }
  function start(){ reset(); state='play'; sfxStart(); AC(); hideAll(); loop(); }
  function hideAll(){ ['startScreen','overScreen','pauseScreen'].forEach(i=>el(i).classList.add('hide')); }

  function gameOver(){
    state='over'; sfxHit();
    const secs=Math.floor(score);
    el('finalScore').textContent=secs;
    if(secs>best){ best=secs; try{localStorage.setItem('neonDodgeBest',String(best));}catch(e){}
      bestEl.textContent=best; el('newBest').textContent='New best!'; }
    else el('newBest').textContent='';
    el('overScreen').classList.remove('hide');
  }

  // ---- input ----
  const keys={};
  addEventListener('keydown',e=>{
    keys[e.key]=true;
    if(e.key==='p'||e.key==='P'){ if(state==='play'){state='pause';el('pauseScreen').classList.remove('hide');} else if(state==='pause'){state='play';el('pauseScreen').classList.add('hide');loop();} }
    if(e.key==='m'||e.key==='M') toggleMute();
    if((e.key===' '||e.key==='Enter') && (state==='start'||state==='over')) start();
  });
  addEventListener('keyup',e=>keys[e.key]=false);
  function pointer(x){ const r=cv.getBoundingClientRect(); ship.tx=(x-r.left)*(W/r.width); }
  cv.addEventListener('mousemove',e=>{ if(state==='play') pointer(e.clientX); });
  cv.addEventListener('touchmove',e=>{ if(state==='play'){ pointer(e.touches[0].clientX); e.preventDefault(); } },{passive:false});
  cv.addEventListener('touchstart',e=>{ if(state==='play'){ pointer(e.touches[0].clientX); } },{passive:true});
  function toggleMute(){ muted=!muted; el('mute').textContent=muted?'🔇':'🔊'; try{localStorage.setItem('neonDodgeMuted',muted?'1':'0');}catch(e){} }
  el('mute').addEventListener('click',toggleMute);
  el('startBtn').addEventListener('click',start);
  el('againBtn').addEventListener('click',start);
  el('resumeBtn').addEventListener('click',()=>{ state='play'; el('pauseScreen').classList.add('hide'); loop(); });

  // ---- update + draw ----
  function update(){
    t++; score += 1/60; speed += 0.0009;
    scoreEl.textContent=Math.floor(score);
    if(Math.floor(score)!==Math.floor(score-1/60)) sfxPoint();

    if(keys['ArrowLeft']||keys['a']) ship.tx-=7;
    if(keys['ArrowRight']||keys['d']) ship.tx+=7;
    ship.tx=Math.max(ship.r, Math.min(W-ship.r, ship.tx));
    ship.x += (ship.tx-ship.x)*0.25;

    spawnT--;
    if(spawnT<=0){ const w=28+Math.random()*70; obstacles.push({ x:Math.random()*(W-w), y:-40, w, h:16+Math.random()*16,
        hue:Math.random()<0.5?190:320, vy:speed*(0.8+Math.random()*0.6) });
      spawnT=Math.max(10, 34-score*0.25); }

    for(const o of obstacles){ o.y+=o.vy;
      if(o.x<ship.x+ship.r && o.x+o.w>ship.x-ship.r && o.y<ship.y+ship.r && o.y+o.h>ship.y-ship.r){ gameOver(); return; } }
    obstacles=obstacles.filter(o=>o.y<H+40);
    for(const s of stars){ s.y+=s.z*speed*0.4; if(s.y>H){ s.y=0; s.x=Math.random()*W; } }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=0.3+s.z*0.3; ctx.fillStyle='#8fb6ff';
      ctx.fillRect(s.x, s.y, s.z, s.z); }
    ctx.globalAlpha=1;
    for(const o of obstacles){ const c=`hsl(${o.hue},90%,60%)`;
      ctx.shadowColor=c; ctx.shadowBlur=18; ctx.fillStyle=c;
      ctx.fillRect(o.x,o.y,o.w,o.h); ctx.shadowBlur=0; }
    // ship
    ctx.save(); ctx.translate(ship.x,ship.y);
    ctx.shadowColor='#22d3ee'; ctx.shadowBlur=22;
    ctx.fillStyle='#e8f0ff'; ctx.beginPath();
    ctx.moveTo(0,-ship.r); ctx.lineTo(ship.r*0.9,ship.r); ctx.lineTo(0,ship.r*0.5); ctx.lineTo(-ship.r*0.9,ship.r); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f472b6'; ctx.fillRect(-3, ship.r*0.4, 6, 10+Math.random()*8);
    ctx.restore(); ctx.shadowBlur=0;
  }

  function loop(){
    if(state!=='play'){ cancelAnimationFrame(raf); return; }
    update(); if(state==='play'){ draw(); raf=requestAnimationFrame(loop); }
  }

  // idle backdrop on start screen
  (function idle(){ if(state==='start'||state==='over'||state==='pause'){ ctx.clearRect(0,0,W,H);
    for(const s of (stars.length?stars:(stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.4}))))){
      s.y=(s.y+s.z*0.6)%H; ctx.globalAlpha=0.25+s.z*0.25; ctx.fillStyle='#8fb6ff'; ctx.fillRect(s.x,s.y,s.z,s.z);} ctx.globalAlpha=1; }
    requestAnimationFrame(idle); })();
})();
</script>
</body>
</html>
